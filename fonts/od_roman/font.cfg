# OD Roman: what is the same for every glyph. Lengths are SVG units, the same
# as in the glyph files in glyphs/ (each one's viewBox width is its advance).
cap_height 15.278      # baseline to the top of a capital
baseline 19.118        # y of the baseline in every glyph file
x_height 10.182       # baseline to the top of a lowercase x
view_height 26      # height of every glyph file's viewBox
pen 0.1              # the stroke-width of a stroke of weight 1.0
default_advance 14.392  # width a new glyph file starts at
weight 100              # default pen width, thousandths of the cap height
bold 1.6                # what bold multiplies the pen by
italic 15               # the slant italic adds, degrees
