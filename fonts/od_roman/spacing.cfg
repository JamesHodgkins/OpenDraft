# OD Roman spacing rules, applied by scripts/od_roman_autospace.py.
#
# The idea: how much room a glyph needs beside it depends on the shape of its
# EDGE, not on the letter. A straight stem needs the most (a whole stroke of
# air), a round edge less (it only touches the line at one point), and the end
# of a diagonal or a flat arm least. Each glyph below names the kind of edge on
# its left and on its right; each kind has a margin.
#
# Margins are in font units (thousandths of the cap height), measured from the
# CENTRE-LINE of the outermost stroke to the edge of the artboard, so half the
# pen (50 at the default weight) is already inside it. Two neighbours' margins
# add: stem beside stem is 150 + 150 = 300 centre to centre, about two pen
# widths of clear air at the default weight.
#
# Change a number and run the tool again; it is the same rule for every glyph
# that uses the kind. To space one glyph by hand instead, leave it out of the
# table (the tool leaves glyphs it does not list alone).

edge stem 150
edge round 120
edge open 100
edge diagonal 80
edge point 110
edge bar 130
edge hook 46

# Lowercase glyphs are multiplied by this: the x-height is smaller, so the
# same absolute air looks looser; but lowercase also wants more room to read
# as a word, so it nets out above 1.0.
lowercase 1.1

# Digits are tabular: all ten get one advance (the widest digit plus this
# margin each side) with their ink centred, so columns of numbers line up.
digits 100

# capitals
A diagonal diagonal
B stem round
C round open
D stem round
E stem open
F stem open
G round stem
H stem stem
I stem stem
J round stem
K stem diagonal
L stem open
M stem stem
N stem stem
O round round
P stem round
Q round round
R stem diagonal
S round round
T open open
U stem stem
V diagonal diagonal
W diagonal diagonal
X diagonal diagonal
Y diagonal diagonal
Z open open

# lowercase
a round stem
b stem round
c round open
d round stem
e round round
f open open
g round stem
h stem stem
i stem stem
j hook stem
k stem diagonal
l stem stem
m stem stem
n stem stem
o round round
p stem round
q round stem
r stem open
s round round
t open open
u stem stem
v diagonal diagonal
w diagonal diagonal
x diagonal diagonal
y diagonal stem
z open open

# punctuation and symbols
! point point
U+0022 point point
' point point
. point point
, point point
; point point
: point point
( round open
) open round
* open open
U+0023 open open
& round round
? round round
U+00B0 round round
+ bar bar
- bar bar
= bar bar
_ bar bar
