name: Bug report
description: Report a reproducible problem with OpenDraft
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OpenDraft. Please search the existing issues before filing a new one.

        **Security problem?** Do not report it here, because issues are public. See the [security policy](https://github.com/JamesHodgkins/OpenDraft/security/policy) instead.

        **Keep private things out of the report.** Do not attach confidential drawings. DXF and DWG files often hold names, company names or file paths in their headers, and screenshots can show your user name in a file path. If a drawing is needed to reproduce the problem, attach a small, sanitised example. GitHub accepts only some file types as attachments, so put a drawing in a `.zip` first.

  - type: input
    id: version
    attributes:
      label: OpenDraft version
      description: Shown under the OpenDraft title on the Home page, for example "version 0.1.2". A build from source also shows a commit hash.
      placeholder: "For example: 0.1.2, or 0.1.2-dev (a1b2c3d4e) for a build from source"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Ubuntu, Debian, or Linux Mint
        - Other Linux distribution
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version (optional)
      description: Include the Linux distribution and desktop environment where relevant.
      placeholder: "For example: Windows 11 24H2, or Fedora 42 with GNOME on Wayland"

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Windows installer (.msi)
        - Windows portable (.zip)
        - Debian package (.deb)
        - AppImage
        - Linux tarball
        - Built from source (debug)
        - Built from source (release)
        - Other
    validations:
      required: true

  - type: dropdown
    id: drawing-format
    attributes:
      label: Drawing or file format involved
      description: Select the main format involved in the problem.
      options:
        - Not file-related
        - ODX
        - DXF
        - DWG
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
      placeholder: |
        What happened:
        What I expected:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Start from a new drawing when possible and include commands, typed values, and clicks.
      placeholder: |
        1. Start a new drawing
        2. Run the ... command
        3. Enter ...
        4. Observe ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen? (optional)
      options:
        - Every time
        - Often
        - Sometimes
        - Once

  - type: textarea
    id: crash
    attributes:
      label: If OpenDraft crashed or would not start (optional)
      description: From version 0.1.3 OpenDraft records crashes in a file called crash.log (Windows - the folder %APPDATA%\OpenDraft\data; Linux - ~/.local/share/opendraft). If it exists, paste its newest report here. On Linux you can also start OpenDraft from a terminal and paste what it prints (`opendraft` if you installed the .deb, `./opendraft` in the folder of the extracted tarball, or the AppImage file itself). Otherwise say whether a window appeared and what any error message said, and if it offered to recover a drawing the next time you started it, mention that.
      render: text

  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add screenshots, screen recordings, or a small sanitised drawing (in a .zip) if useful. Drag files into this box to attach them.
      placeholder: "Anything else that could help us investigate the problem."

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and did not find this problem already reported.
          required: true
        - label: I removed private or sensitive information from any files, screenshots, and logs I attached.
          required: true
