name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # An environment RUSTFLAGS replaces .cargo/config.toml, so the Windows
      # static-runtime flag is repeated here (see that file).
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev
      - name: Licence tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about
      - name: Dependency licences are on the allowed list, and their notices can be made
        if: runner.os == 'Linux'
        run: |
          cargo deny check licenses
          bash scripts/third_party.sh "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
