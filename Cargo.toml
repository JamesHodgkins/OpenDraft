[workspace]
resolver = "2"
members = [
    "crates/opendraft-app",
    "crates/opendraft-ui",
    "crates/opendraft-core",
    "crates/opendraft-commands",
    "crates/opendraft-canvas",
    "crates/opendraft-files",
    "crates/opendraft-dwg",
    "crates/opendraft-api",
    "crates/opendraft-mcp",
    "crates/opendraft-agent",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# accesskit is off: its Windows adapter panics when the dock rearranges panels.
eframe = { version = "0.31", default-features = false, features = ["persistence", "glow", "default_fonts", "wayland", "x11"] }
opendraft-ui = { path = "crates/opendraft-ui" }
opendraft-core = { path = "crates/opendraft-core" }
opendraft-commands = { path = "crates/opendraft-commands" }
opendraft-canvas = { path = "crates/opendraft-canvas" }
opendraft-files = { path = "crates/opendraft-files" }
opendraft-dwg = { path = "crates/opendraft-dwg" }
opendraft-api = { path = "crates/opendraft-api" }
opendraft-agent = { path = "crates/opendraft-agent" }

# Dependencies (egui especially) are slow unoptimised; our own crates keep fast
# incremental debug builds.
[profile.dev.package."*"]
opt-level = 2
