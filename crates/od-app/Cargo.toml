[package]
name = "od-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opendraft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eframe.workspace = true
od-ui.workspace = true
od-core.workspace = true
od-commands.workspace = true
od-canvas.workspace = true
od-files.workspace = true
od-api.workspace = true
serde_json = "1"
interprocess = "2"
getrandom = "0.3"
egui_dock = { version = "0.16", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
rfd = "0.17.2"
arboard = { version = "3", default-features = false }
fontdb = "0.23"
# PNG previews of recent drawings. 0.18.1 (MIT OR Apache-2.0, so fine under
# GPL-3.0-or-later) is the version egui already brings in through `image`.
png = "0.18.1"
# The local date and time of an autosave on the Home page (MIT OR Apache-2.0;
# already in the lock file).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
