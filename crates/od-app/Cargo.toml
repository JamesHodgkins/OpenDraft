[package]
name = "od-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "opendraft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eframe.workspace = true
od-ui.workspace = true
od-core.workspace = true
od-commands.workspace = true
od-canvas.workspace = true
od-files.workspace = true
od-api.workspace = true
od-agent.workspace = true
# Carries a PNG picture in JSON (MIT OR Apache-2.0; 0.23 is already in the lock file).
base64 = "0.23"
keyring = "4"
serde_json = "1"
interprocess = "2"
getrandom = "0.3"
egui_dock = { version = "0.16", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
rfd = "0.17.2"
arboard = { version = "3", default-features = false }
fontdb = "0.23"
# PNG previews of recent drawings. 0.18.1 (MIT OR Apache-2.0, so fine under
# GPL-3.0-or-later) is the version egui already brings in through `image`.
png = "0.18.1"
# The local date and time of an autosave on the Home page (MIT OR Apache-2.0;
# already in the lock file).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Asks GitHub whether a newer release exists, on a background thread, once the
# user has allowed it (MIT OR Apache-2.0). Plain `rustls` with its default
# certificate list; no gzip, no JSON layer (we parse with serde_json).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Version ordering for that check (MIT OR Apache-2.0; already in the lock file).
semver = "1"

[target.'cfg(windows)'.build-dependencies]
# The program's icon and version information in the Windows exe (MIT).
winresource = "0.1"

# The Windows installer (`cargo packager --release -f wix` after
# `cargo build --release -p od-app -p od-mcp`; see installer/windows/main.wxs).
# The version is this package's, so the installer cannot disagree with the
# program; an MSI takes numeric versions only, so prerelease tags get none.
[package.metadata.packager]
product-name = "OpenDraft"
identifier = "uk.openengineering.opendraft"
publisher = "OpenDraft project"
# The .deb's Maintainer field.
authors = ["OpenDraft project <contact@openengineering.uk>"]
description = "OpenDraft, a 2D CAD program"
# The longer text `apt show` displays.
long-description = """OpenDraft is a free, open-source 2D CAD program with a ribbon, a command line and the familiar drafting commands. It reads DXF and DWG files and keeps its own .odx format. This package also installs opendraft-mcp, which lets an AI assistant work with open drawings (off until you turn it on in Settings)."""
homepage = "https://github.com/JamesHodgkins/OpenDraft"
license-file = "../../LICENSE"
out-dir = "../../dist/packager"
binaries-dir = "../../target/release"
icons = [
    "../../assets/app.ico",
    "../../assets/app-icons/16x16.png",
    "../../assets/app-icons/32x32.png",
    "../../assets/app-icons/48x48.png",
    "../../assets/app-icons/64x64.png",
    "../../assets/app-icons/128x128.png",
    "../../assets/app-icons/256x256.png",
]
formats = ["wix"]
binaries = [
    { path = "opendraft", main = true },
    { path = "opendraft-mcp" },
]

[package.metadata.packager.wix]
template = "../../installer/windows/main.wxs"
banner-path = "../../installer/windows/banner.bmp"
dialog-image-path = "../../installer/windows/dialog.bmp"

# Linux: `cargo packager --release -f deb,appimage` (see installer/linux). The file
# type is what the desktop entry's MimeType lists; the .deb also installs the
# shared-mime-info file that says *.odx is that type.
[[package.metadata.packager.file-associations]]
extensions = ["odx"]
mime-type = "application/x-opendraft-drawing"
description = "OpenDraft drawing"
name = "OpenDraft.Drawing"

# The AppImage must bring the libraries winit opens at run time that a plain desktop
# might lack (found on the build machine under /usr/lib*, so CI installs them first).
# The core window system and the graphics libraries stay the system's.
[package.metadata.packager.appimage]
libs = [
    "libxkbcommon.so.0",
    "libxkbcommon-x11.so.0",
    "libXcursor.so.1",
    "libXi.so.6",
    "libX11-xcb.so.1",
]

[package.metadata.packager.deb]
package-name = "opendraft"
# Built on Ubuntu 22.04 (glibc 2.35). The window toolkit opens these at run time
# (winit: libX11, libXcursor, libX11-xcb, libXi, libxkbcommon and its X11 part, and
# the Wayland libraries; the graphics: libGL and libEGL), so a package manager that
# reads only the program's linked libraries would miss them: they are listed here.
# scripts/test_deb.sh checks the list on a bare Ubuntu in CI.
depends = [
    "libc6 (>= 2.35)",
    "libgl1",
    "libegl1",
    "libx11-6",
    "libx11-xcb1",
    "libxcb1",
    "libxcursor1",
    "libxi6",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "libwayland-cursor0",
    "libwayland-egl1",
]
desktop-template = "../../installer/linux/opendraft.desktop"
files = { "../../installer/linux/opendraft.xml" = "usr/share/mime/packages/opendraft.xml" }
