[package]
name = "od-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "opendraft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eframe.workspace = true
od-ui.workspace = true
od-core.workspace = true
od-commands.workspace = true
od-canvas.workspace = true
od-files.workspace = true
od-api.workspace = true
serde_json = "1"
interprocess = "2"
getrandom = "0.3"
egui_dock = { version = "0.16", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
rfd = "0.17.2"
arboard = { version = "3", default-features = false }
fontdb = "0.23"
# PNG previews of recent drawings. 0.18.1 (MIT OR Apache-2.0, so fine under
# GPL-3.0-or-later) is the version egui already brings in through `image`.
png = "0.18.1"
# The local date and time of an autosave on the Home page (MIT OR Apache-2.0;
# already in the lock file).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Asks GitHub whether a newer release exists, on a background thread, once the
# user has allowed it (MIT OR Apache-2.0). Plain `rustls` with its default
# certificate list; no gzip, no JSON layer (we parse with serde_json).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Version ordering for that check (MIT OR Apache-2.0; already in the lock file).
semver = "1"

[target.'cfg(windows)'.build-dependencies]
# The program's icon and version information in the Windows exe (MIT).
winresource = "0.1"

# The Windows installer (`cargo packager --release -f wix` after
# `cargo build --release -p od-app -p od-mcp`; see installer/windows/main.wxs).
# The version is this package's, so the installer cannot disagree with the
# program; an MSI takes numeric versions only, so prerelease tags get none.
[package.metadata.packager]
product-name = "OpenDraft"
identifier = "uk.openengineering.opendraft"
publisher = "OpenDraft project"
description = "OpenDraft, a 2D CAD program"
homepage = "https://github.com/JamesHodgkins/OpenDraft"
license-file = "../../LICENSE"
out-dir = "../../dist/packager"
binaries-dir = "../../target/release"
icons = ["../../assets/app.ico"]
formats = ["wix"]
binaries = [
    { path = "opendraft", main = true },
    { path = "opendraft-mcp" },
]

[package.metadata.packager.wix]
template = "../../installer/windows/main.wxs"
