[package]
name = "od-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The in-app assistant's harness: the loop between a model and the drawing's tools"

[lints]
workspace = true

[dependencies]
od-api.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same client the app uses to check for updates; only the Mistral module
# reaches the network.
ureq = { version = "3", default-features = false, features = ["rustls"] }
